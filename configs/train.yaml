# Configuration de l'entraînement RL - src/train.py

algos: [dqn, ppo]      # liste des algos à entraîner
seeds: [0, 1, 2]        # seeds pour les courbes moyenne ± écart-type
total_timesteps: 50000
learning_rate: 0.0003
eval_freq: 2000        # fréquence (en pas) d'évaluation pendant l'entraînement
